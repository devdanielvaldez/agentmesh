[workspace]
members = [
    "crates/agentmesh",
    "crates/agentmesh-config",
    "crates/agentmesh-core",
    "crates/agentmesh-discovery",
    "crates/agentmesh-error",
    "crates/agentmesh-gateway",
    "crates/agentmesh-protocol",
    "crates/agentmesh-proxy",
    "crates/agentmesh-router",
    "crates/agentmesh-load-balancer",
    "crates/agentmesh-health",
    "crates/agentmesh-circuit-breaker",
    "crates/agentmesh-resilience",
    "crates/agentmesh-tasks",
    "crates/agentmesh-authn",
    "crates/agentmesh-authz",
    "crates/agentmesh-policy",
    "crates/agentmesh-rate-limit",
    "crates/agentmesh-credentials",
    "crates/agentmesh-security",
    "crates/agentmesh-cache",
    "crates/agentmesh-telemetry",
    "crates/agentmesh-audit",
    "crates/agentmesh-storage",
    "crates/agentmesh-control-plane",
    "crates/agentmesh-control-api",
    "crates/agentmesh-runtime",
    "crates/agentmesh-plugins",
    "crates/agentmesh-testkit",
    "crates/agentmesh-registry",
    "crates/agentmesh-transport",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Daniel Valdez"]
repository = "https://github.com/devdanielvaldez/agentmesh"
homepage = "https://github.com/devdanielvaldez/agentmesh"
documentation = "https://docs.rs/agentmesh"
keywords = ["mcp", "ai", "gateway", "service-mesh", "proxy"]
categories = ["network-programming", "web-programming"]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.3"
# Avoid the newer ICU-backed adapter chain whose current releases exceed the workspace MSRV.
idna_adapter = "=1.1.0"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "compression-gzip", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
url = "=2.5.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
