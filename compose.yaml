services:
  agentmesh:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: agentmesh=info,tower_http=info
    volumes:
      - ./config/agentmesh.yaml:/etc/agentmesh/agentmesh.yaml:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped

